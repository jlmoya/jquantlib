name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reactor-compile:
    name: Reactor compile + test (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compile reactor (all modules, main + test sources)
        run: mvn -B -ntp clean compile test-compile

      - name: Run tests (full inner suite + outer modules)
        # The full jquantlib suite (3721 tests) runs fine on hosted runners (~9 min).
        # The old "full-suite memory issue" that once justified skipping it was traced
        # to an unrelated local machine problem and closed 2026-05-22.
        run: mvn -B -ntp test -pl jquantlib,jquantlib-helpers,jquantlib-samples -am
