<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Implied Volatility')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar('impliedVol')}"></nav>

<main class="container my-4">
    <h3 class="mb-1">Implied Volatility</h3>
    <p class="text-muted">Given a traded option price, JQuantLib's solver inverts the Black–Scholes formula to find the
        volatility that reproduces it. The price is monotone in volatility, so the solution is unique.</p>

    <div class="row g-4">
        <div class="col-lg-3">
            <form id="ivform" class="card card-body controls">
                <div class="mb-2"><label class="form-label">Option type</label>
                    <select class="form-select form-select-sm" name="type">
                        <option value="Call" selected>Call</option><option value="Put">Put</option>
                    </select></div>
                <div class="mb-2"><label class="form-label">Spot S</label>
                    <input class="form-control form-control-sm" type="number" step="any" name="spot" value="100"/></div>
                <div class="mb-2"><label class="form-label">Strike K</label>
                    <input class="form-control form-control-sm" type="number" step="any" name="strike" value="100"/></div>
                <div class="mb-2"><label class="form-label">Risk-free rate r</label>
                    <input class="form-control form-control-sm" type="number" step="any" name="rate" value="0.05"/></div>
                <div class="mb-2"><label class="form-label">Dividend yield q</label>
                    <input class="form-control form-control-sm" type="number" step="any" name="div" value="0.00"/></div>
                <div class="mb-2"><label class="form-label">Days to expiry</label>
                    <input class="form-control form-control-sm" type="number" name="days" value="180"/></div>
                <div class="mb-3"><label class="form-label">Market price</label>
                    <input class="form-control form-control-sm" type="number" step="any" name="price" value="7.0"/></div>
                <button id="go" class="btn btn-primary btn-sm w-100" type="submit">Solve</button>
            </form>
        </div>

        <div class="col-lg-9">
            <div id="errbox"></div>
            <p id="summary" class="formula mb-3"></p>
            <div id="metrics" class="row g-2 mb-3"></div>
            <div class="card card-body">
                <h6 class="text-muted">Option price vs volatility (market price dashed)</h6>
                <div class="chart-box tall"><canvas id="ivChart"></canvas></div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>

<script>
    const form = document.getElementById('ivform');

    async function solve() {
        const btn = document.getElementById('go');
        setBusy(btn, true);
        document.getElementById('errbox').replaceChildren();
        try {
            const d = await qFetch('/api/option/implied-vol?' + formParams(form));
            setText('summary', d.summary);
            document.getElementById('metrics').innerHTML =
                '<div class="col-6 col-md-4"><div class="card card-body py-2">' + metric('Implied volatility', fmt(d.impliedVolPercent, 2), '%') + '</div></div>' +
                '<div class="col-6 col-md-4"><div class="card card-body py-2">' + metric('Market price', fmt(d.marketPrice)) + '</div></div>' +
                '<div class="col-6 col-md-4"><div class="card card-body py-2">' + metric('Reprices to', fmt(d.recoveredPrice)) + '</div></div>';

            const marketLine = d.volPercent.map(v => d.marketPrice);
            drawChart('ivChart', {
                type: 'line',
                data: {labels: d.volPercent, datasets: [
                    lineSet('Black–Scholes price', d.price, COLORS.blue),
                    {label: 'Market price', data: marketLine, borderColor: COLORS.red, borderWidth: 2,
                        borderDash: [6, 4], pointRadius: 0}
                ]},
                options: {scales: {x: {title: {display: true, text: 'volatility (%)'}}, y: {title: {display: true, text: 'price'}}}}
            });
        } catch (e) {
            showError('errbox', e.message);
        } finally {
            setBusy(btn, false);
        }
    }

    form.addEventListener('submit', e => { e.preventDefault(); solve(); });
    solve();
</script>
</body>
</html>
