<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Dividend Options')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar('dividends')}"></nav>

<main class="container my-4">
    <h3 class="mb-1">Discrete-Dividend Options</h3>
    <p class="text-muted">Real stocks pay <em>discrete cash dividends</em>, not a continuous yield. The
        <span class="mono">jquantlib-helpers</span> binomial dividend engines handle them exactly — here against
        the otherwise-identical option that pays nothing.</p>

    <div class="row g-4">
        <div class="col-lg-3">
            <form id="divform" class="card card-body controls">
                <div class="mb-2"><label class="form-label">Option type</label>
                    <select class="form-select form-select-sm" name="type">
                        <option value="Call" selected>Call</option><option value="Put">Put</option></select></div>
                <div class="mb-2"><label class="form-label">Exercise</label>
                    <select class="form-select form-select-sm" name="style">
                        <option value="European" selected>European</option><option value="American">American</option></select></div>
                <div class="mb-2"><label class="form-label">Spot S</label>
                    <input class="form-control form-control-sm" type="number" step="any" name="spot" value="100"/></div>
                <div class="mb-2"><label class="form-label">Strike K</label>
                    <input class="form-control form-control-sm" type="number" step="any" name="strike" value="100"/></div>
                <div class="mb-2"><label class="form-label">Risk-free rate r</label>
                    <input class="form-control form-control-sm" type="number" step="any" name="rate" value="0.05"/></div>
                <div class="mb-2"><label class="form-label">Continuous yield q</label>
                    <input class="form-control form-control-sm" type="number" step="any" name="yield" value="0.00"/></div>
                <div class="mb-2"><label class="form-label">Volatility σ</label>
                    <input class="form-control form-control-sm" type="number" step="any" name="vol" value="0.25"/></div>
                <div class="mb-2"><label class="form-label">Days to expiry</label>
                    <input class="form-control form-control-sm" type="number" name="days" value="365"/></div>
                <div class="mb-2"><label class="form-label">Dividend amount (each)</label>
                    <input class="form-control form-control-sm" type="number" step="any" name="dividendAmount" value="2.0"/></div>
                <div class="mb-3"><label class="form-label">Number of dividends</label>
                    <input class="form-control form-control-sm" type="number" name="dividendCount" value="4"/></div>
                <button id="go" class="btn btn-primary btn-sm w-100" type="submit">Price option</button>
            </form>
        </div>

        <div class="col-lg-9">
            <div id="errbox"></div>
            <p id="summary" class="formula mb-3"></p>
            <div id="metrics" class="row g-2 mb-3"></div>
            <div class="row g-4">
                <div class="col-xl-8">
                    <div class="card card-body">
                        <h6 class="text-muted">Value vs spot — with vs without dividends</h6>
                        <div class="chart-box"><canvas id="divChart"></canvas></div>
                    </div>
                </div>
                <div class="col-xl-4">
                    <div class="card card-body">
                        <h6 class="text-muted">Dividend schedule</h6>
                        <table class="table table-sm mb-0"><tbody id="schtbody"></tbody></table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>

<script>
    const form = document.getElementById('divform');

    async function price() {
        const btn = document.getElementById('go');
        setBusy(btn, true);
        document.getElementById('errbox').replaceChildren();
        try {
            const d = await qFetch('/api/dividend?' + formParams(form));
            setText('summary', d.summary);
            const g = d.greeks;
            const cards = [
                ['Value (with dividends)', fmt(d.npv)],
                ['Value (no dividends)', fmt(d.npvNoDividends)],
                ['Delta', fmt(g.delta)], ['Gamma', fmt(g.gamma, 5)],
                ['Theta', fmt(g.theta, 4)], ['Vega', fmt(g.vega)]
            ];
            document.getElementById('metrics').innerHTML = cards.map(c =>
                '<div class="col-6 col-md-4 col-xxl-2"><div class="card card-body py-2">' + metric(c[0], c[1]) + '</div></div>').join('');

            const body = document.getElementById('schtbody');
            body.replaceChildren();
            for (const p of d.schedule) {
                const tr = document.createElement('tr');
                tr.innerHTML = '<td class="mono small"></td><td class="num">' + fmt(p.amount, 2) + '</td>';
                tr.children[0].textContent = p.date;
                body.appendChild(tr);
            }

            drawChart('divChart', {
                type: 'line',
                data: {labels: d.sweep.spot, datasets: [
                    lineSet('With dividends', d.sweep.withDividends, COLORS.blue),
                    lineSet('No dividends', d.sweep.noDividends, COLORS.green, {borderDash: [6, 4], backgroundColor: 'transparent'})
                ]},
                options: {scales: {x: {title: {display: true, text: 'Spot'}}}}
            });
        } catch (e) {
            showError('errbox', e.message);
        } finally {
            setBusy(btn, false);
        }
    }

    form.addEventListener('submit', e => { e.preventDefault(); price(); });
    price();
</script>
</body>
</html>
